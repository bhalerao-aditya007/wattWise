services:
  mongodb:
    image: mongo:7
    container_name: wattwise_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wattwise_mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wattwise_api
    restart: always
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/wattwise}
      JWT_SECRET: wattwise_tpds3_production_secret
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - mosquitto

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wattwise_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo_data:
  mosquitto_data:
