services:
  mysql:
    image: mysql:8.0
    container_name: wattwise_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wattwise_root_pw
      MYSQL_DATABASE: wattwise
      MYSQL_USER: wattwise_user
      MYSQL_PASSWORD: wattwise_user_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed_tariffs.sql:/docker-entrypoint-initdb.d/02_tariffs.sql
      - ./db/seed_catalog.sql:/docker-entrypoint-initdb.d/03_catalog.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql
      - ./db/views.sql:/docker-entrypoint-initdb.d/05_views.sql
      - ./db/seed_demo.sql:/docker-entrypoint-initdb.d/06_demo.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wattwise_mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wattwise_api
    restart: always
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_USER: wattwise_user
      DB_PASSWORD: wattwise_user_pw
      DB_NAME: wattwise
      JWT_SECRET: wattwise_tpds3_production_secret
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wattwise_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
  mosquitto_data:
